name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

env:
  FLUTTER_VERSION: '3.44.2'
  # Public info: SHA-1 of the Play Store upload-key certificate, confirmed
  # against Play Console -> 설정 -> 앱 무결성 -> 앱 서명 -> 업로드 키 인증서.
  # If this ever fails to match what CI extracts from the built AAB, STOP —
  # do not remove or "fix" this check to make the build green. A mismatch
  # means the wrong key signed the bundle and Play will reject the upload
  # (or worse, silently expect it going forward). Recovering from an upload
  # to Play with the wrong key requires a Google support request.
  EXPECTED_UPLOAD_KEY_SHA1: 'E5:1D:6A:6F:45:E2:4D:98:14:A9:10:28:CD:5B:6B:B7:DA:7C:C7:93'

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Upload AAB
    runs-on: ubuntu-latest
    environment: play-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      # Secrets are passed via `env:` (not interpolated directly into the
      # script) so their raw values never appear in the rendered `run:`
      # command text, and the heredoc is left unquoted only so that these
      # env-var references expand -- the substituted values themselves are
      # not re-scanned for further shell expansion, so passwords containing
      # `$`, backticks, or quotes cannot corrupt the file or execute anything.
      - name: Write key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > android/app/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=./key.jks
          EOF

      - run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      # `jarsigner` (not `apksigner`) is correct here: AGP's release
      # signingConfig produces v2-scheme-only signatures for APKs, which
      # `jarsigner` cannot read ("jar is unsigned"). App Bundles (.aab) are
      # plain zip/JAR-format archives that Gradle signs with standard JAR
      # (v1) signing regardless of the APK signing scheme -- `jarsigner`
      # understands that format natively. `apksigner` does not support
      # verifying .aab files at all, so it cannot be used here.
      #
      # This step (a) cryptographically verifies the bundle's JAR signature,
      # then (b) extracts the actual signing certificate straight from the
      # built .aab (not from the keystore file) and compares its SHA-1
      # fingerprint against the known-good upload-key fingerprint. Step (b)
      # is the load-bearing check: it proves the artifact that is about to
      # be uploaded was really signed with our upload key, not just that our
      # keystore file matches itself.
      - name: Verify AAB is signed with the correct upload key
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::Expected bundle not found at $AAB"
            exit 1
          fi

          if ! jarsigner -verify "$AAB" > jarsigner.log 2>&1; then
            cat jarsigner.log
            echo "::error::jarsigner could not verify the AAB signature"
            exit 1
          fi
          echo "jarsigner: signature is cryptographically valid"

          ACTUAL_SHA1=$(keytool -printcert -jarfile "$AAB" | awk -F': ' '/SHA1:/ {print $2; exit}')
          echo "Upload key SHA-1 (from built AAB): $ACTUAL_SHA1"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_UPLOAD_KEY_SHA1" ]; then
            echo "::error::Upload key mismatch! Expected $EXPECTED_UPLOAD_KEY_SHA1 but the AAB is signed with $ACTUAL_SHA1. Aborting before Play upload -- do not remove this check to work around a failure."
            exit 1
          fi
          echo "Upload key fingerprint matches the expected Play Store upload key."

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nowaa.intervalpractice
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Clean up secrets from runner
        if: always()
        run: rm -f android/app/key.jks android/app/key.properties jarsigner.log
