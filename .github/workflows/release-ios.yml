name: Release iOS

# =============================================================================
# BLOCKED -- do not run this workflow yet.
#
# It cannot succeed until the following Apple assets exist and are registered
# as GitHub Secrets. As of the commit that introduced this file, NONE of them
# do -- only Android signing material has been supplied so far:
#   - App Store Connect API Key (.p8) + its Key ID + Issuer ID
#   - iOS Distribution certificate (.p12) + the password it was exported with
#   - A provisioning profile (.mobileprovision) covering com.nowaa.intervalpractice
#     + its exact profile name (the "Name" field inside the profile, not the
#     filename)
#   - the Apple Developer Team ID
#
# See docs/deployment/ios-release-setup.md for exactly what to generate, how
# to encode each one, and which Secret it goes into. Triggering this workflow
# (tag push or workflow_dispatch) before that guide's checklist is complete
# will fail partway through -- at best fast, at "Verify certificate was
# imported"; at worst deep inside the ~10-15 minute Xcode archive/export step
# -- and burns a macos-latest runner for nothing.
#
# Nothing in this file has been run end-to-end. YAML validity and actionlint
# have been checked; the actual signing, archive, export, and TestFlight
# upload steps are unverified because there is nothing to sign with yet.
# =============================================================================

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.44.2'
  IOS_BUNDLE_ID: com.nowaa.intervalpractice

permissions:
  contents: read

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    # Mirrors release-android.yml's `environment: play-release` gate. Create
    # a "testflight-release" environment under Settings -> Environments and
    # add required reviewers if you want a manual approval step before this
    # job can run. Works fine without it too -- GitHub auto-creates the
    # environment on first use.
    environment: testflight-release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-release.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # word splitting is intentional: each
          # existing keychain path must become its own -s argument.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

      # Secrets are passed via `env:` (not interpolated directly into the
      # script) for the same reason release-android.yml does this: their raw
      # values never appear in the rendered `run:` command text, so a
      # password containing `$`, backticks, or quotes cannot corrupt the file
      # or execute anything.
      - name: Import distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # Fails fast, with a clear message, if the .p12/password pair didn't
      # actually produce a usable signing identity -- otherwise the first
      # sign of trouble would be a much more cryptic failure deep inside the
      # Xcode archive step several minutes later. `security find-identity`
      # prints "0 valid identities found" (no numbered "1)" line) when empty.
      - name: Verify certificate was imported
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q '^  1)'; then
            echo "::error::No codesigning identity found in the keychain after import. Check IOS_CERTIFICATE_BASE64 and IOS_CERTIFICATE_PASSWORD."
            exit 1
          fi

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/release-ios.mobileprovision"

      # Best-effort diagnostics, not a hard gate: prints the profile's team,
      # name, application-identifier and expiration date so a bundle-ID
      # mismatch or an expired profile is visible in the log immediately
      # instead of surfacing as an opaque codesign failure later. This does
      # NOT fail the build on mismatch -- the exact plist key layout of a
      # decoded .mobileprovision could not be verified against a real Apple
      # profile in this environment, so it only warns.
      - name: Inspect provisioning profile
        run: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/release-ios.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          echo "Name:                  $(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST" 2>/dev/null || echo '(unreadable)')"
          echo "TeamIdentifier:        $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST" 2>/dev/null || echo '(unreadable)')"
          echo "application-identifier:$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || echo '(unreadable)')"
          echo "ExpirationDate:        $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST" 2>/dev/null || echo '(unreadable)')"

          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null | grep -q "$IOS_BUNDLE_ID"; then
            echo "::warning::Could not confirm the provisioning profile's application-identifier contains $IOS_BUNDLE_ID. Double-check IOS_PROVISIONING_PROFILE_BASE64 is the right profile before trusting a green run."
          fi

      # Generated at runtime from Secrets rather than committed to the repo.
      # A committed ios/ExportOptions.plist with REPLACE_WITH_* placeholders
      # would build "successfully" right up until Xcode tried to resolve a
      # team/profile named REPLACE_WITH_TEAM_ID -- a silent trap for whoever
      # forgets to edit it, and it would need real values checked into git
      # history (Team ID and profile name aren't secret-secret, but they
      # don't belong in source control either). Generating it here means
      # there is nothing to forget and nothing to keep in sync by hand.
      - name: Generate ExportOptions.plist
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          PLIST=ios/ExportOptions.plist
          cat > "$PLIST" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>teamID</key>
          	<string></string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.nowaa.intervalpractice</key>
          		<string></string>
          	</dict>
          </dict>
          </plist>
          PLIST_EOF
          /usr/libexec/PlistBuddy -c "Set :teamID $APPSTORE_TEAM_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.nowaa.intervalpractice $IOS_PROVISIONING_PROFILE_NAME" "$PLIST"
          plutil -lint "$PLIST"

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # The exported filename is NOT the pubspec package name
      # ("intervalpractice") -- Xcode names it after the Runner target's
      # PRODUCT_NAME, which resolves to the target name "Runner"
      # (ios/Runner.xcodeproj/project.pbxproj: PRODUCT_NAME = "$(TARGET_NAME)",
      # target name "Runner"). A local `flutter build ios --release
      # --no-codesign` on this branch produced build/ios/iphoneos/Runner.app,
      # confirming this. Flutter's own tool source
      # (flutter_tools/lib/src/commands/build_ios.dart) doesn't hardcode the
      # exported .ipa filename either -- it glob-matches
      # "$relativeOutputPath/*.ipa" in its own success message, because
      # xcodebuild -- not flutter -- names the file, from the archive's
      # product name. Discovering it here instead of hardcoding
      # "intervalpractice.ipa" (or even "Runner.ipa") avoids depending on
      # that assumption ever being wrong.
      - name: Locate exported IPA
        id: locate_ipa
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa file found under build/ios/ipa. The 'Build IPA' step above likely failed to export (see its log) even though flutter build ipa reported success -- this can happen when the xcarchive step succeeds but xcodebuild -exportArchive fails afterward."
            ls -la build/ios/ipa 2>/dev/null || echo "build/ios/ipa does not exist"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.locate_ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Clean up secrets from runner
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/release-ios.mobileprovision"
          rm -f ios/ExportOptions.plist
